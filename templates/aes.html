{% extends "base.html" %}

{% block content %}

<h1>AES Encryption</h1>

<form method="POST">

    <textarea
        name="text"
        rows="6"
        cols="60"
        placeholder="Enter text"
        required
    ></textarea>

    <br><br>

    <button
        type="submit"
        name="encrypt"
    >
        Encrypt
    </button>

    <button
        type="submit"
        name="decrypt"
    >
        Decrypt
    </button>

</form>

{% if encrypted %}

<h2>Encrypted Output</h2>

<textarea
    rows="6"
    cols="60"
    readonly
>{{ encrypted }}</textarea>

{% endif %}

{% if decrypted %}

<h2>Decrypted Output</h2>

<textarea
    rows="6"
    cols="60"
    readonly
>{{ decrypted }}</textarea>

{% endif %}

{% endblock %}
